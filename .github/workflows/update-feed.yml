name: Update StreamCorner TV feed

on:
  # Scheduled runs are best-effort on GitHub; workflow_dispatch provides an
  # immediate refresh path when a live provider rotates between cron runs.
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-feed.yml"
      - "README.md"
      - "site/index.html"
  workflow_dispatch:
  schedule:
    # Avoid :00, where GitHub reports the highest schedule-trigger load.
    - cron: "2-59/5 * * * *"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  # Isolate feed publishing from the orphaned legacy Pages concurrency queue.
  group: streamcorner-feed-publisher
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Check out scraper
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test provider mapping and duplicate preference
        run: node --test tools/*.test.mjs

      - name: Install public catalog runtime
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Validate one-off sanitized snapshot
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Sanitize deployed feed for retired provider [snapshot-20260927-r4f8]' }}
        run: node tools/validate-retired-snapshot.mjs

      - name: Validate one-off retired-card correction
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Remove retired-only cards [snapshot-20260927-c9e2]' }}
        env:
          RETIREMENT_MODE: empty-cards
        run: node tools/validate-retired-snapshot.mjs

      - name: Scrape current games and stream URLs
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || (github.event.head_commit.message != 'Sanitize deployed feed for retired provider [snapshot-20260927-r4f8]' && github.event.head_commit.message != 'Remove retired-only cards [snapshot-20260927-c9e2]') }}
        env:
          APP_FEED_OUTPUT: site/games.json
          SCRAPE_OUTPUT: private-data/scraped-streams.json
          STATUS_OUTPUT: site/status.json
          SPORTS_STREAMS_MANIFEST_URL: ${{ secrets.SPORTS_STREAMS_MANIFEST_URL }}
        run: node tools/scrape-streams.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload feed
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Wait for uploaded feed metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, per_page: 100,
                request: { timeout: 5000 },
              });
              const matches = data.artifacts.filter(artifact =>
                artifact.name === process.env.PAGES_ARTIFACT_NAME && !artifact.expired);
              if (matches.length === 1) return;
              if (matches.length > 1) throw new Error('Ambiguous current-attempt feed artifact');
              core.info(`Waiting for current-attempt feed artifact (${attempt + 1}/12)`);
              if (attempt < 11) await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Uploaded feed artifact did not become visible after 12 checks');

      - name: Deploy feed
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait before retrying Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Retry feed deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
