name: Update StreamCorner TV feed

on:
  # Scheduled runs are best-effort on GitHub; workflow_dispatch provides an
  # immediate refresh path when a live provider rotates between cron runs.
  push:
    branches:
      - main
    paths:
      - "tools/**"
      - ".github/workflows/update-feed.yml"
      - "README.md"
      - "site/index.html"
  workflow_dispatch:
  schedule:
    # Avoid :00, where GitHub reports the highest schedule-trigger load.
    - cron: "2-59/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out scraper
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test provider mapping and duplicate preference
        run: node --test tools/*.test.mjs

      - name: Validate one-off sanitized snapshot
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Sanitize deployed feed for retired provider [snapshot-20260927-r4f8]' }}
        run: node tools/validate-retired-snapshot.mjs

      - name: Validate one-off retired-card correction
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Remove retired-only cards [snapshot-20260927-c9e2]' }}
        env:
          RETIREMENT_MODE: empty-cards
        run: node tools/validate-retired-snapshot.mjs

      - name: Scrape current games and stream URLs
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || (github.event.head_commit.message != 'Sanitize deployed feed for retired provider [snapshot-20260927-r4f8]' && github.event.head_commit.message != 'Remove retired-only cards [snapshot-20260927-c9e2]') }}
        env:
          APP_FEED_OUTPUT: site/games.json
          SCRAPE_OUTPUT: private-data/scraped-streams.json
          STATUS_OUTPUT: site/status.json
        run: node tools/scrape-streams.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload feed
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy feed
        id: deployment
        uses: actions/deploy-pages@v4
